
databaseChangeLog:
  - changeSet:
      id: 001-create-organizations
      author: developer
      changes:
        - createTable:
            tableName: organizations
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
              - column:
                  name: slug
                  type: VARCHAR(63)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - sql:
            sql: >
              ALTER TABLE organizations
              ADD CONSTRAINT chk_organization_slug
              CHECK (slug ~ '^[a-z0-9]+(-[a-z0-9]+)*$');

  - changeSet:
      id: 002-create-app-users
      author: developer
      changes:
        - createTable:
            tableName: app_users
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password_hash
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

  - changeSet:
      id: 003-create-memberships
      author: developer
      changes:
        - createTable:
            tableName: memberships
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: organization_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: memberships
            baseColumnNames: user_id
            referencedTableName: app_users
            referencedColumnNames: id
            constraintName: fk_memberships_user

        - addForeignKeyConstraint:
            baseTableName: memberships
            baseColumnNames: organization_id
            referencedTableName: organizations
            referencedColumnNames: id
            constraintName: fk_memberships_organization

        - addUniqueConstraint:
            tableName: memberships
            columnNames: user_id, organization_id
            constraintName: uq_membership_user_organization

        - sql:
            sql: >
              ALTER TABLE memberships
              ADD CONSTRAINT chk_membership_role
              CHECK (role IN ('OWNER', 'MEMBER', 'VIEWER'));
